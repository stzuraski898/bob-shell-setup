name: Build Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'gui/**'
      - '.github/workflows/build-executable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bob-agents-gui-linux-x86_64
            dist_path: dist/bob-agents-gui
            asset_name: bob-agents-gui-linux-x86_64
          - os: macos-latest
            artifact_name: BobAgentLauncher-macos
            dist_path: dist/BobAgentLauncher.app
            asset_name: BobAgentLauncher-macos.zip
          - os: windows-latest
            artifact_name: bob-agents-gui-windows.exe
            dist_path: dist/bob-agents-gui.exe
            asset_name: bob-agents-gui-windows.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build executable with PyInstaller
        run: |
          cd gui
          pyinstaller --clean --noconfirm --distpath ../dist --workpath ../build bob-agents-gui.spec

      - name: Zip macOS App Bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r BobAgentLauncher-macos.zip BobAgentLauncher.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}

      - name: Publish Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.os == 'macos-latest' && 'dist/BobAgentLauncher-macos.zip' || matrix.dist_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
